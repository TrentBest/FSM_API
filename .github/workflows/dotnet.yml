name: .NET

on:
  push:
    branches: [ "master", "development" ]
  pull_request:
    branches: [ "master", "development" ]
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish the packed package to NuGet.org"
        required: true
        default: false
        type: boolean

jobs:
  build_test_and_package:
    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@v7
    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: '8.0.x'
        
    - name: Cache NuGet packages
      uses: actions/cache@v5
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/FSM_API.csproj') }}
        restore-keys: |
          ${{ runner.os }}-nuget-
    
    - name: Restore Solution Dependencies
      run: dotnet restore FSM_API.sln

    - name: Build and Test for .NET 8.0
      run: |
        dotnet build FSM_API.sln --no-restore --configuration Release
        dotnet test Tests/FSM_API.Tests.csproj --no-build --configuration Release --framework net8.0 --collect:"XPlat Code Coverage" --results-directory ./TestResults --logger "trx;LogFileName=testresults.trx"
      
    - name: Pack NuGet Package
      run: |
        dotnet pack FSM_API/FSM_API.csproj \
          --no-build \
          --configuration Release \
          -o nuget-packages \
          /p:Version=$(grep "<Version>" FSM_API/FSM_API.csproj | sed -n 's/.*<Version>\(.*\)<\/Version>.*/\1/p')

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v6
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: ./TestResults/**/coverage.cobertura.xml
        fail_ci_if_error: true

    - name: Rename DLLs before upload
      run: |
        mkdir publish
        cp FSM_API/bin/Release/net8.0/FSM_API.dll publish/FSM_API_net8.dll
        cp FSM_API/bin/Release/net6.0/FSM_API.dll publish/FSM_API_net6.dll
        cp FSM_API/bin/Release/net47/FSM_API.dll publish/FSM_API_net47.dll
        cp FSM_API/bin/Release/netcoreapp3.1/FSM_API.dll publish/FSM_API_netcoreapp3.1.dll
        cp FSM_API/bin/Release/netstandard2.1/FSM_API.dll publish/FSM_API_netstandard2.1.dll

    - name: Upload DLLs as Artifacts
      uses: actions/upload-artifact@v7
      with:
        name: fsm-api-dlls
        path: publish/*
          
    - name: Upload NuGet Package as Artifact
      uses: actions/upload-artifact@v7
      with:
        name: nuget-package
        path: nuget-packages/*.nupkg
  
  build_documentation:
    runs-on: ubuntu-24.04
    needs: build_test_and_package

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'
          
      - name: Validate local documentation links
        run: python3 scripts/validate_doc_links.py

      - name: Install DocFx
        run: dotnet tool install --global docfx
      
      - name: Generate documentation
        run: docfx build
        
      - name: Upload documentation as artifact
        uses: actions/upload-artifact@v7
        with:
          name: fsm-api-documentation
          path: _site
  
  sith_branch_policy:
    # Only evaluate branch governance when someone explicitly requests publication.
    # Ordinary build/test/package CI remains usable while historical branches are reviewed.
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish == true }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Verify live branch inventory follows Operation Sith
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t actual_branches < <(gh api --paginate "repos/${GITHUB_REPOSITORY}/branches?per_page=100" --jq '.[].name' | sort)
          expected_branches=("development" "master")

          printf 'Live branches reported by GitHub:\n'
          printf '  %s\n' "${actual_branches[@]}"

          if [[ "${#actual_branches[@]}" -ne "${#expected_branches[@]}" ]] || [[ "${actual_branches[*]}" != "${expected_branches[*]}" ]]; then
            printf '\nERROR: NuGet publication is blocked by Operation Sith.\n' >&2
            printf 'Expected exactly: %s\n' "${expected_branches[*]}" >&2
            printf 'Found:            %s\n' "${actual_branches[*]:-(none)}" >&2
            printf 'Preserve and review surplus branches, then have the repository owner perform any approved cleanup.\n' >&2
            exit 1
          fi

          if [[ "${GITHUB_REF}" != "refs/heads/master" ]]; then
            echo "ERROR: NuGet publication is allowed only from refs/heads/master." >&2
            exit 1
          fi

          echo "Operation Sith branch inventory verified; publication gate may proceed."
          
  publish_nuget:
    needs: [build_test_and_package, sith_branch_policy]
    runs-on: ubuntu-24.04
    if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.publish == true && github.ref == 'refs/heads/master' && needs.build_test_and_package.result == 'success' && needs.sith_branch_policy.result == 'success' }}
    permissions:
      contents: read
      id-token: write

    steps:
    - name: Download NuGet Package Artifact
      uses: actions/download-artifact@v8
      with:
        name: nuget-package
        path: ./nuget-packages

    - name: Authenticate with NuGet Trusted Publishing
      uses: NuGet/login@v1
      id: login
      with:
        user: TheSingularityWorkshop

    - name: Publish to NuGet.org
      run: dotnet nuget push "nuget-packages/*.nupkg" --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source "https://api.nuget.org/v3/index.json" --skip-duplicate
