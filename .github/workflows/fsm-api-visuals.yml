name: FSM_API living visuals

on:
  push:
    branches:
      - development
    paths:
      - "Documentation/Visuals/**"
      - ".github/workflows/fsm-api-visuals.yml"
  pull_request:
    paths:
      - "Documentation/Visuals/**"
      - ".github/workflows/fsm-api-visuals.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out FSM_API
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # pinned commit SHA
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0

      - name: Check out GUI.SVG source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # pinned commit SHA
        with:
          repository: TrentBest/TheSingularityWorkshop.GUI
          ref: b4268c8db4e69908fb0b876f081aa323497d00d3
          path: TheSingularityWorkshop.GUI

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Generate documentation SVGs with GUI.SVG
        run: dotnet run --project Documentation/Visuals/FsmApiVisuals.csproj --configuration Release

      - name: Commit changed generated visuals
        if: (github.event_name == 'push' && github.ref == 'refs/heads/development') || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Documentation/Visuals/*.svg
          if git diff --cached --quiet; then
            echo "Generated SVGs are already current."
          else
            git commit -m "docs: regenerate FSM_API living visuals"
            git push origin "HEAD:${{ github.event.pull_request.head.ref || github.ref_name }}"
          fi

      - name: Upload generated visuals
        uses: actions/upload-artifact@v4
        with:
          name: fsm-api-living-visuals
          path: Documentation/Visuals/*.svg
          if-no-files-found: error
