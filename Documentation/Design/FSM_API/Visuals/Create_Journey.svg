<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">FSM_API Create: from idea to running FSM</title>
  <desc id="desc">An animated teaching diagram showing an optional processing group, an FSM builder, a built definition, a context-bound runtime instance, and repeated updates. It distinguishes the reusable blueprint from each live instance.</desc>
  <defs>
    <style>
      text{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#172033}
      .heading{font-size:30px;font-weight:750}.sub{font-size:16px;fill:#4b5568}
      .stage{fill:#fff;stroke:#b8c4d8;stroke-width:2}.num{font-size:15px;font-weight:800;fill:#fff}
      .label{font-size:20px;font-weight:700}.body{font-size:15px;fill:#344054}.code{font:14px ui-monospace,SFMono-Regular,Consolas,monospace;fill:#24324b}
      .line{fill:none;stroke:#64748b;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}\n      .route{fill:none;stroke:#2563eb;stroke-width:6;stroke-linecap:round;stroke-dasharray:8 13;opacity:.12;animation:routeGlow 6s step-end infinite,travel 2.4s linear infinite}\n      .r1{animation-delay:0s,0s}.r2{animation-delay:1.2s,0s}.r3{animation-delay:2.4s,0s}.r4{animation-delay:3.6s,0s}.r5{animation-delay:4.8s,0s}
      .group{stroke:#7c3aed}.blueprint{stroke:#2563eb}.instance{stroke:#0f766e}.tick{stroke:#c2410c}
      .pill{fill:#f3f6fb;stroke:#d6deea;stroke-width:1}
      .pulse{fill:none;stroke:#2563eb;stroke-width:5;stroke-linecap:round;stroke-dasharray:10 15;animation:travel 3.8s linear infinite}
      .glow{animation:glow 4.8s ease-in-out infinite}
      .glow2{animation:glow 4.8s ease-in-out infinite 1.2s}
      .glow3{animation:glow 4.8s ease-in-out infinite 2.4s}
      .tickpulse{animation:tick 2.8s ease-in-out infinite}
      @keyframes travel{to{stroke-dashoffset:-100}}\n      @keyframes routeGlow{0%,19%{opacity:1;filter:drop-shadow(0 0 6px #60a5fa)}20%,100%{opacity:.12;filter:none}}
      @keyframes glow{0%,12%,100%{filter:none}4%,8%{filter:drop-shadow(0 0 7px #60a5fa)}}
      @keyframes tick{0%,100%{opacity:.4}50%{opacity:1}}
      @media(prefers-reduced-motion:reduce){.pulse,.glow,.glow2,.glow3,.tickpulse,.route{animation:none}.route{opacity:.45}}
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker>
    <marker id="blueArrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2563eb"/></marker>
  </defs>
  <rect width="1200" height="760" rx="24" fill="#f7f9fc"/>
  <text x="54" y="62" class="heading">Create is a journey, not a single object</text>
  <text x="54" y="92" class="sub">Define reusable behavior once. Bind it to one or more contexts. Then let the application drive updates.</text>

  <g transform="translate(52 142)">
    <rect class="stage group" width="236" height="166" rx="18"/>
    <circle cx="28" cy="28" r="17" fill="#7c3aed"/><text x="28" y="33" text-anchor="middle" class="num">1</text>
    <text x="22" y="68" class="label">Processing group</text>
    <text x="22" y="95" class="body">Optional to pre-create</text>
    <text x="22" y="121" class="code">CreateProcessingGroup()</text>
    <text x="22" y="145" class="body">Organizes update work</text>
  </g>
  <path d="M292 225H324" class="line" marker-end="url(#arrow)"/>\n  <path d="M292 225H324" class="route r1"/>
  <g transform="translate(334 142)" class="glow">
    <rect class="stage blueprint" width="236" height="166" rx="18"/>
    <circle cx="28" cy="28" r="17" fill="#2563eb"/><text x="28" y="33" text-anchor="middle" class="num">2</text>
    <text x="22" y="68" class="label">FSM builder</text>
    <text x="22" y="95" class="body">Describe states, actions,</text>
    <text x="22" y="117" class="body">transitions and start state</text>
    <text x="22" y="145" class="code">CreateFiniteStateMachine()</text>
  </g>
  <path d="M574 225H606" class="line" marker-end="url(#arrow)"/>\n  <path d="M574 225H606" class="route r2"/>
  <g transform="translate(616 142)" class="glow2">
    <rect class="stage blueprint" width="236" height="166" rx="18"/>
    <circle cx="28" cy="28" r="17" fill="#2563eb"/><text x="28" y="33" text-anchor="middle" class="num">3</text>
    <text x="22" y="68" class="label">Definition</text>
    <text x="22" y="95" class="body">BuildDefinition()</text>
    <text x="22" y="121" class="body">Registers the blueprint</text>
    <text x="22" y="145" class="body">No context-bound handle yet</text>
  </g>
  <path d="M856 225H888" class="line" marker-end="url(#arrow)"/>\n  <path d="M856 225H888" class="route r3"/>
  <g transform="translate(898 142)" class="glow3">
    <rect class="stage instance" width="250" height="166" rx="18"/>
    <circle cx="28" cy="28" r="17" fill="#0f766e"/><text x="28" y="33" text-anchor="middle" class="num">4</text>
    <text x="22" y="68" class="label">Runtime instance</text>
    <text x="22" y="95" class="body">CreateInstance(name, context)</text>
    <text x="22" y="121" class="body">A handle binds the definition</text>
    <text x="22" y="145" class="body">to one IStateContext</text>
  </g>

  <path d="M1023 312V363H724" class="line" marker-end="url(#arrow)"/>\n  <path d="M1023 312V363H724" class="route r4"/>
  <g transform="translate(334 374)">
    <rect x="0" y="0" width="390" height="156" rx="18" fill="#fff7ed" stroke="#c2410c" stroke-width="2"/>
    <circle cx="30" cy="30" r="17" fill="#c2410c"/><text x="30" y="35" text-anchor="middle" class="num">5</text>
    <text x="24" y="70" class="label">Application update</text>
    <text x="24" y="99" class="code">FSM_API.Interaction.Update(group)</text>
    <text x="24" y="126" class="body">The host decides when to tick.</text>
    <path d="M30 142H360" class="pulse"/>
  </g>
  <path d="M334 452H272V226H284" class="line tickpulse" stroke-dasharray="6 7" marker-end="url(#arrow)"/>\n  <path d="M334 452H272V226H284" class="route r5"/>
  <text x="54" y="394" class="label">The important distinction</text>
  <text x="54" y="424" class="body">Definition = reusable recipe</text>
  <text x="54" y="450" class="body">Instance = one running machine</text>
  <text x="54" y="476" class="body">Context = your application's data</text>
  <text x="54" y="502" class="body">Group = how updates are organized</text>

  <rect x="52" y="566" width="1096" height="126" rx="18" fill="#edf2f9" stroke="#d3dce9"/>
  <text x="78" y="600" class="label">Why the separation matters</text>
  <text x="78" y="630" class="body">One definition can guide many independent instances. Each instance carries its own context and current runtime state.</text>
  <text x="78" y="655" class="body">Creating a group is optional: FSM_API creates the group when needed. Build the definition before requesting an instance.</text>
  <text x="78" y="679" class="sub">Teaching animation only — not live runtime telemetry. Reduced-motion preferences are respected.</text>
</svg>