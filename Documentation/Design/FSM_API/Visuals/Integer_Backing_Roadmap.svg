<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 690" role="img" aria-labelledby="title desc">
  <title id="title">Integer-backed FSM implementation progress roadmap</title>
  <desc id="desc">A six-stage roadmap. Integer data representation and the runtime API are implemented on an isolated feature branch. The latest feature-branch CI passes all 400 tests. Full parity, the authoring bridge, benchmark evidence, and integration remain open.</desc>
  <defs>
    <style>
      text{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#20242b}
      .h1{font-size:30px;font-weight:750}.sub{font-size:15px;fill:#535c68}
      .step{font-size:17px;font-weight:700}.body{font-size:13px;fill:#424b56}
      .state{font-size:11px;font-weight:750;letter-spacing:1px}
      .done{fill:#e4f5e9;stroke:#38875b}.warn{fill:#fff0d7;stroke:#c17c14}.todo{fill:#edf0f4;stroke:#8a96a5}
      .doneText{fill:#21633e}.warnText{fill:#87510a}.todoText{fill:#596472}
      .line{stroke:#b7c0ca;stroke-width:2;fill:none}.dot{fill:#6f7a87}
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#8a96a5"/></marker>
  </defs>
  <rect x="0" y="0" width="1120" height="690" rx="18" fill="#ffffff"/>
  <text x="40" y="52" class="h1">Integer backing: where we are, what remains</text>
  <text x="40" y="80" class="sub">Evidence-based roadmap · no guessed completion percentage · feature branch ≠ development</text>
  <rect x="40" y="105" width="1040" height="76" rx="12" class="done"/>
  <text x="62" y="133" class="state doneText">LATEST VALIDATION</text>
  <text x="62" y="157" class="step">Feature-branch CI: 400 / 400 tests passed</text>
  <text x="620" y="157" class="body">Mutation regressions fixed; bridge/compiler is next.</text>
  <path class="line" d="M560 181 V205 H185 V225 M560 205 H560 V225 M560 205 H935 V225"/>
  <path class="line" d="M185 350 V380 H185 V402 M560 350 V380 H560 V402 M935 350 V380 H935 V402"/>
  <g>
    <rect x="40" y="225" width="290" height="125" rx="12" class="done"/>
    <text x="60" y="250" class="state doneText">01 · IMPLEMENTED</text>
    <text x="60" y="278" class="step">Integer representation</text>
    <text x="60" y="302" class="body">Integer FSM/state IDs</text>
    <text x="60" y="321" class="body">Resizable array-indexed storage</text>
    <text x="60" y="339" class="body">Feature branch only</text>
  </g>
  <g>
    <rect x="415" y="225" width="290" height="125" rx="12" class="done"/>
    <text x="435" y="250" class="state doneText">02 · IMPLEMENTED</text>
    <text x="435" y="278" class="step">Runtime surface</text>
    <text x="435" y="302" class="body">Handle, builder, timers</text>
    <text x="435" y="321" class="body">Runtime facade, scheduling</text>
    <text x="435" y="339" class="body">Parity still unproven</text>
  </g>
  <g>
    <rect x="790" y="225" width="290" height="125" rx="12" class="done"/>
    <text x="810" y="250" class="state doneText">03 · PASSING</text>
    <text x="810" y="278" class="step">Runtime invariants</text>
    <text x="810" y="302" class="body">Snapshot + registration check</text>
    <text x="810" y="321" class="body">400/400 regression suite passes</text>
    <text x="810" y="339" class="body">Validated on isolated branch</text>
  </g>
  <g>
    <rect x="40" y="402" width="290" height="125" rx="12" class="todo"/>
    <text x="60" y="427" class="state todoText">04 · OPEN</text>
    <text x="60" y="455" class="step">Authoring bridge</text>
    <text x="60" y="479" class="body">Names ↔ deterministic integer IDs</text>
    <text x="60" y="498" class="body">Validation + reverse mapping</text>
    <text x="60" y="516" class="body">Not found in feature tree</text>
  </g>
  <g>
    <rect x="415" y="402" width="290" height="125" rx="12" class="todo"/>
    <text x="435" y="427" class="state todoText">05 · OPEN</text>
    <text x="435" y="455" class="step">Parity + performance proof</text>
    <text x="435" y="479" class="body">Complete side-by-side behavior tests</text>
    <text x="435" y="498" class="body">Benchmark time + allocations</text>
    <text x="435" y="516" class="body">Dense and sparse ID cases</text>
  </g>
  <g>
    <rect x="790" y="402" width="290" height="125" rx="12" class="todo"/>
    <text x="810" y="427" class="state todoText">06 · NOT STARTED</text>
    <text x="810" y="455" class="step">Integration gate</text>
    <text x="810" y="479" class="body">Port to development after validation</text>
    <text x="810" y="498" class="body">Full CI + docs + API review</text>
    <text x="810" y="516" class="body">No release implied</text>
  </g>
  <rect x="40" y="555" width="1040" height="96" rx="12" fill="#f7f8fa" stroke="#cbd2da"/>
  <text x="62" y="582" class="state">IMPORTANT BOUNDARY</text>
  <text x="62" y="607" class="step">Integer indexing is not proof that the whole system is O(1).</text>
  <text x="62" y="630" class="body">Keep the string API, integer API, and any Warehouse-backed specialized package as distinct design decisions.</text>
</svg>