<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc">
<title id="title">Separate behavior dimensions to reduce duplicated state combinations</title>
<desc id="desc">A conceptual comparison of one flat machine combining movement and combat states with two separate behavior machines. Three movement states combined with three combat states make nine combinations. Separate handles do not imply parallel threads or automatic synchronization; the application must coordinate shared data.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101827"/><stop offset="1" stop-color="#192f40"/></linearGradient><style>text{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#edf5fb}.ey{font-size:12px;font-weight:800;letter-spacing:1.7px;fill:#9eb4c7}.hd{font-size:22px;font-weight:750}.cp{font-size:14px;fill:#c2d1dd}.tiny{font-size:12px;fill:#b5c6d3}.panel{fill:#172a3a;stroke:#3d586d;stroke-width:1.5}.flat{fill:#293244;stroke:#c5a6f5;stroke-width:1.4}.move{fill:#163c4b;stroke:#69d6f2;stroke-width:1.5}.combat{fill:#3a3020;stroke:#f3c56e;stroke-width:1.5}@media(prefers-reduced-motion:reduce){circle{display:none}}</style></defs>
<rect width="1000" height="560" rx="20" fill="url(#bg)"/><text x="32" y="38" class="ey">DESIGN CHOICE · STATE-SPACE SHAPE</text><text x="32" y="70" class="hd">Keep independent questions independent</text><text x="32" y="95" class="cp">Conceptual teaching model — not live telemetry or automatic coordination.</text><path d="M32 112H968" stroke="#344d60"/>
<rect x="28" y="132" width="460" height="300" rx="15" class="panel"/><text x="50" y="165" class="ey">A · ONE COMBINED MACHINE</text><text x="50" y="194" class="hd">Movement × combat</text><text x="50" y="217" class="cp">Each combination becomes a state.</text>
<g font-size="12" text-anchor="middle"><g class="flat"><rect x="50" y="238" width="125" height="43" rx="8"/><rect x="184" y="238" width="125" height="43" rx="8"/><rect x="318" y="238" width="145" height="43" rx="8"/><rect x="50" y="291" width="125" height="43" rx="8"/><rect x="184" y="291" width="125" height="43" rx="8"/><rect x="318" y="291" width="145" height="43" rx="8"/><rect x="50" y="344" width="125" height="43" rx="8"/><rect x="184" y="344" width="125" height="43" rx="8"/><rect x="318" y="344" width="145" height="43" rx="8"/></g><g><text x="112" y="256">Walk + Aim</text><text x="112" y="271"> </text><text x="246" y="256">Walk + Fire</text><text x="390" y="256">Walk + Reload</text><text x="112" y="309">Run + Aim</text><text x="246" y="309">Run + Fire</text><text x="390" y="309">Run + Reload</text><text x="112" y="362">Idle + Aim</text><text x="246" y="362">Idle + Fire</text><text x="390" y="362">Idle + Reload</text></g></g><text x="50" y="412" class="cp">3 movement × 3 combat options = 9 combinations</text>
<rect x="512" y="132" width="460" height="300" rx="15" class="panel"/><text x="534" y="165" class="ey">B · SEPARATE BEHAVIOR DIMENSIONS</text><text x="534" y="194" class="hd">Movement FSM + Combat FSM</text><text x="534" y="217" class="cp">Each machine models one concern.</text>
<rect x="534" y="238" width="185" height="148" rx="11" class="move"/><text x="552" y="265" font-size="16" font-weight="750">Movement FSM</text><g fill="#245264"><rect x="550" y="279" width="153" height="26" rx="6"/><rect x="550" y="313" width="153" height="26" rx="6"/><rect x="550" y="347" width="153" height="26" rx="6"/></g><g text-anchor="middle" font-size="12"><text x="626" y="297">Idle</text><text x="626" y="331">Walking</text><text x="626" y="365">Running</text></g>
<rect x="741" y="238" width="207" height="148" rx="11" class="combat"/><text x="759" y="265" font-size="16" font-weight="750">Combat FSM</text><g fill="#514027"><rect x="757" y="279" width="175" height="26" rx="6"/><rect x="757" y="313" width="175" height="26" rx="6"/><rect x="757" y="347" width="175" height="26" rx="6"/></g><g text-anchor="middle" font-size="12"><text x="844" y="297">Aiming</text><text x="844" y="331">Firing</text><text x="844" y="365">Reloading</text></g>
<path d="M719 313H737" stroke="#9ab4c7" stroke-width="2"/><circle r="4" fill="#f5fffb"><animateMotion dur="2.4s" repeatCount="indefinite" path="M719 313H737"/></circle><text x="534" y="410" class="tiny">Host/context defines how concerns communicate.</text>
<rect x="28" y="449" width="944" height="83" rx="13" fill="#10251f" stroke="#39745d"/><text x="50" y="477" font-size="16" font-weight="750" fill="#8be4bc">The trade-off</text><text x="50" y="500" class="cp">Separation can reduce duplicated combinations, but it does not erase real dependencies.</text><text x="50" y="520" class="cp">Separate handles ≠ separate threads or automatic synchronization. The application coordinates.</text></svg>