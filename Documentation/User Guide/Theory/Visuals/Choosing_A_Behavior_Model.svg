<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 610" role="img" aria-labelledby="title desc">
<title id="title">Choosing a behavior model</title><desc id="desc">A conceptual decision guide. Use a finite-state machine when behavior has a small or manageable set of named modes with guarded transitions. Separate FSMs or hierarchical composition can help with independent or nested concerns, but application code must coordinate them. Prefer continuous controllers for continuous dynamics and behavior trees or planners for complex task sequencing or goal-driven action selection. These approaches can be combined.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101827"/><stop offset="1" stop-color="#1b3040"/></linearGradient><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#9ab4c7"/></marker><style>text{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#edf5fb}.ey{font-size:12px;font-weight:800;letter-spacing:1.7px;fill:#9eb4c7}.hd{font-size:22px;font-weight:750}.cp{font-size:14px;fill:#c2d1dd}.small{font-size:13px;fill:#c2d1dd}.q{fill:#1b3445;stroke:#72bce9;stroke-width:1.5}.fsm{fill:#163d30;stroke:#6fdaa6;stroke-width:1.5}.other{fill:#302a43;stroke:#c5a6f5;stroke-width:1.5}.line{fill:none;stroke:#9ab4c7;stroke-width:2.2;marker-end:url(#arrow)}.pill{fill:#253d4e;stroke:#49667a}</style></defs>
<rect width="1000" height="610" rx="20" fill="url(#bg)"/><text x="32" y="38" class="ey">A PRACTICAL DESIGN GUIDE</text><text x="32" y="72" class="hd">Choose the model that matches the shape of the problem</text><text x="32" y="97" class="cp">These are heuristics, not exclusive categories. Real systems often combine patterns.</text><path d="M32 115H968" stroke="#344d60"/>
<rect x="300" y="137" width="400" height="66" rx="13" class="q"/><text x="500" y="164" text-anchor="middle" font-size="17" font-weight="750">Can you name distinct modes</text><text x="500" y="186" text-anchor="middle" font-size="17" font-weight="750">and the conditions for changing them?</text>
<path d="M500 203V232H250V257M500 232V257M500 232H750V257" class="line"/>
<text x="365" y="226" class="small">Yes, with multiple dimensions</text><text x="517" y="250" class="small">Mostly yes</text><text x="745" y="226" class="small">Not really</text>
<rect x="34" y="260" width="286" height="120" rx="13" class="fsm"/><text x="54" y="289" font-size="17" font-weight="750">Separate / compose FSMs</text><text x="54" y="314" class="small">Independent concerns or nested phases</text><text x="54" y="337" class="small">Make coordination explicit in the app.</text><text x="54" y="359" class="small">Not automatic parallelism or hierarchy.</text>
<rect x="357" y="260" width="286" height="120" rx="13" class="fsm"/><text x="377" y="289" font-size="17" font-weight="750">Finite-state machine</text><text x="377" y="314" class="small">Named phases + guarded transitions</text><text x="377" y="337" class="small">Good for workflows, modes, and lifecycle.</text><text x="377" y="359" class="small">Keep states and transition rules legible.</text>
<rect x="680" y="260" width="286" height="120" rx="13" class="other"/><text x="700" y="289" font-size="17" font-weight="750">Consider another core model</text><text x="700" y="314" class="small">Continuous values? Use a controller.</text><text x="700" y="337" class="small">Task sequencing? Try a behavior tree.</text><text x="700" y="359" class="small">Goal search? Consider a planner / GOAP.</text>
<path d="M177 380V407H500M500 380V407M823 380V407H500V432" class="line"/>
<rect x="245" y="434" width="510" height="64" rx="13" class="q"/><text x="500" y="460" text-anchor="middle" font-size="17" font-weight="750">Can one pattern express the whole problem clearly?</text><text x="500" y="482" text-anchor="middle" class="small">If not, combine patterns with explicit interfaces and ownership.</text>
<rect x="34" y="520" width="932" height="62" rx="12" class="pill"/><text x="54" y="545" font-size="15" font-weight="750">FSM_API boundary</text><text x="54" y="567" class="small">FSM_API supplies state-machine execution; your host still owns the loop, domain data, and cross-behavior coordination.</text></svg>