<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" role="img" aria-labelledby="title desc">
  <title id="title">An everyday finite-state model of a powered door</title>
  <desc id="desc">Four states—Closed, Opening, Open, and Closing—connected by guarded transitions. The model describes behavior; sensors, safety interlocks, timing, and motor control belong to the application.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#64748b"/>
    </marker>
    <style>
      .state { fill:#f8fafc; stroke:#64748b; stroke-width:2; rx:16; }
      .label { font:600 21px system-ui,sans-serif; fill:#0f172a; text-anchor:middle; }
      .small { font:15px system-ui,sans-serif; fill:#334155; text-anchor:middle; }
      .edge { fill:none; stroke:#64748b; stroke-width:2.5; marker-end:url(#arrow); }
      .trigger { font:14px system-ui,sans-serif; fill:#475569; text-anchor:middle; }
    </style>
  </defs>
  <rect x="1" y="1" width="998" height="328" rx="18" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="500" y="38" font-family="system-ui,sans-serif" font-size="23" font-weight="700" text-anchor="middle" fill="#0f172a">A powered door: behavior made explicit</text>
  <path class="edge" d="M218 133 H276"/>
  <path class="edge" d="M468 133 H526"/>
  <path class="edge" d="M718 133 H776"/>
  <path class="edge" d="M870 190 C870 253 130 253 130 190"/>
  <text class="trigger" x="247" y="111">open requested</text>
  <text class="trigger" x="497" y="111">open limit reached</text>
  <text class="trigger" x="747" y="111">close requested</text>
  <text class="trigger" x="500" y="244">close limit reached</text>
  <rect class="state" x="28" y="88" width="190" height="90"/>
  <rect class="state" x="278" y="88" width="190" height="90" stroke="#2563eb"/>
  <rect class="state" x="528" y="88" width="190" height="90"/>
  <rect class="state" x="778" y="88" width="190" height="90" stroke="#b45309"/>
  <text class="label" x="123" y="124">Closed</text>
  <text class="small" x="123" y="151">motor stopped</text>
  <text class="label" x="373" y="124">Opening</text>
  <text class="small" x="373" y="151">motor opens</text>
  <text class="label" x="623" y="124">Open</text>
  <text class="small" x="623" y="151">motor stopped</text>
  <text class="label" x="873" y="124">Closing</text>
  <text class="small" x="873" y="151">motor closes</text>
  <rect x="278" y="88" width="190" height="90" rx="16" fill="none" stroke="#2563eb" stroke-width="4" opacity="0">
    <animate attributeName="opacity" values="0;0.75;0" dur="4s" repeatCount="indefinite"/>
  </rect>
  <text x="500" y="294" font-family="system-ui,sans-serif" font-size="14" text-anchor="middle" fill="#475569">Conceptual teaching diagram • not a live controller or safety design</text>
</svg>