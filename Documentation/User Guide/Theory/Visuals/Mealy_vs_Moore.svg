<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" role="img" aria-labelledby="title desc">
<title id="title">Mealy and Moore machine output models</title>
<desc id="desc">Two conceptual models. In a Moore machine, output is associated with the current state. In a Mealy machine, output is associated with a transition and its input or condition. FSM_API provides state actions and transition predicates, but no dedicated transition-output callback; the diagram is theory, not a claim that both modes are built in.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101827"/><stop offset="1" stop-color="#1b3040"/></linearGradient><marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#9ab4c7"/></marker><style>text{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#edf5fb}.ey{font-size:12px;font-weight:800;letter-spacing:1.6px;fill:#9eb4c7}.hd{font-size:22px;font-weight:750}.cp{font-size:14px;fill:#c2d1dd}.node{fill:#183e4b;stroke:#69d6f2;stroke-width:2}.out{fill:#19392d;stroke:#70dba7;stroke-width:1.5}.edge{fill:none;stroke:#9ab4c7;stroke-width:2.5;marker-end:url(#arr)}.panel{fill:#172a3a;stroke:#3d586d;stroke-width:1.5}</style></defs>
<rect width="1000" height="500" rx="20" fill="url(#bg)"/><text x="32" y="38" class="ey">THEORY · WHERE OUTPUT IS ATTACHED</text><text x="32" y="72" class="hd">Same idea, different output model</text><text x="32" y="97" class="cp">These are formal FSM classifications, not selectable built-in modes in FSM_API.</text><path d="M32 115H968" stroke="#344d60"/>
<rect x="28" y="135" width="460" height="245" rx="15" class="panel"/><text x="50" y="169" class="ey">MOORE MACHINE</text><text x="50" y="197" class="hd">Output belongs to the state</text>
<circle cx="145" cy="268" r="39" class="node"/><text x="145" y="273" text-anchor="middle" font-size="15" font-weight="750">Idle</text><circle cx="326" cy="268" r="39" class="node"/><text x="326" y="273" text-anchor="middle" font-size="15" font-weight="750">Active</text><path d="M184 268H282" class="edge"/><text x="232" y="250" text-anchor="middle" class="cp">input</text><rect x="87" y="323" width="116" height="35" rx="8" class="out"/><text x="145" y="345" text-anchor="middle" font-size="13">Lamp off</text><rect x="268" y="323" width="116" height="35" rx="8" class="out"/><text x="326" y="345" text-anchor="middle" font-size="13">Lamp on</text><path d="M145 307V319M326 307V319" stroke="#70dba7" stroke-width="2"/>
<rect x="512" y="135" width="460" height="245" rx="15" class="panel"/><text x="534" y="169" class="ey">MEALY MACHINE</text><text x="534" y="197" class="hd">Output belongs to the transition</text>
<circle cx="620" cy="268" r="39" class="node"/><text x="620" y="273" text-anchor="middle" font-size="15" font-weight="750">Idle</text><circle cx="858" cy="268" r="39" class="node"/><text x="858" y="273" text-anchor="middle" font-size="15" font-weight="750">Active</text><path d="M659 268H814" class="edge"/><rect x="683" y="230" width="109" height="29" rx="7" class="out"/><text x="737" y="249" text-anchor="middle" font-size="12">emit “click”</text><text x="737" y="293" text-anchor="middle" class="cp">button pressed</text><path d="M858 307V332H620V310" fill="none" stroke="#9ab4c7" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arr)"/><text x="739" y="353" text-anchor="middle" class="cp">illustrative return path</text>
<rect x="28" y="398" width="944" height="76" rx="13" fill="#10251f" stroke="#39745d"/><text x="50" y="424" font-size="15" font-weight="750" fill="#8be4bc">FSM_API boundary</text><text x="50" y="447" class="cp">State actions are available; transition conditions should remain predicates. There is no dedicated</text><text x="50" y="466" class="cp">transition-output callback, so represent Mealy-style outputs explicitly in application/context logic.</text></svg>