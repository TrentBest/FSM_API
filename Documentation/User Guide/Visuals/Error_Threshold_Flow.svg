<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 610" role="img" aria-labelledby="title desc">
<title id="title">FSM_API instance and definition error thresholds</title><desc id="desc">An explanatory diagram of current error-handling flow. Instance errors increment a cumulative counter; success does not automatically reset it. Reaching the instance threshold queues deferred work that reports the threshold, increments the definition error count, destroys the handle, and removes its instance counter. Reaching the definition threshold queues definition destruction with catch/finally around that destruction attempt. Instance cleanup does not use try/finally around all preceding callbacks, so it is not an unconditional guarantee.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101827"/><stop offset="1" stop-color="#1b3040"/></linearGradient><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#9ab4c7"/></marker><style>text{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#edf5fb}.ey{font-size:12px;font-weight:800;letter-spacing:1.7px;fill:#9eb4c7}.hd{font-size:21px;font-weight:750}.cp{font-size:14px;fill:#c2d1dd}.sm{font-size:12px;fill:#b5c6d3}.panel{fill:#172a3a;stroke:#3d586d;stroke-width:1.5}.count{fill:#183e4b;stroke:#69d6f2;stroke-width:1.5}.queue{fill:#352e1f;stroke:#f3c56e;stroke-width:1.5}.action{fill:#163d30;stroke:#6fdaa6;stroke-width:1.5}.warn{fill:#3a2529;stroke:#f29aa0;stroke-width:1.5}.line{fill:none;stroke:#9ab4c7;stroke-width:2.2;marker-end:url(#arrow)}</style></defs>
<rect width="1000" height="610" rx="20" fill="url(#bg)"/><text x="32" y="38" class="ey">ERROR POLICY · CURRENT IMPLEMENTATION</text><text x="32" y="72" class="hd">Thresholds schedule cleanup; they are not magic exception shields</text><text x="32" y="97" class="cp">Counts are cumulative until reset or teardown; successful updates do not automatically clear them.</text><path d="M32 115H968" stroke="#344d60"/>
<rect x="32" y="139" width="205" height="83" rx="12" class="count"/><text x="134" y="168" text-anchor="middle" font-size="16" font-weight="750">Instance error</text><text x="134" y="191" text-anchor="middle" class="cp">count increments</text><text x="134" y="209" text-anchor="middle" class="sm">on each reported error</text>
<path d="M237 180H277" class="line"/><rect x="283" y="139" width="205" height="83" rx="12" class="queue"/><text x="385" y="168" text-anchor="middle" font-size="16" font-weight="750">Threshold reached?</text><text x="385" y="191" text-anchor="middle" class="cp">count ≥ instance limit</text><text x="385" y="209" text-anchor="middle" class="sm">enqueue deferred work</text>
<path d="M488 180H528" class="line"/><rect x="534" y="139" width="205" height="83" rx="12" class="action"/><text x="636" y="168" text-anchor="middle" font-size="16" font-weight="750">Deferred callback</text><text x="636" y="191" text-anchor="middle" class="cp">reports threshold</text><text x="636" y="209" text-anchor="middle" class="sm">records definition error</text>
<path d="M739 180H779" class="line"/><rect x="785" y="139" width="183" height="83" rx="12" class="action"/><text x="876" y="168" text-anchor="middle" font-size="16" font-weight="750">Destroy handle</text><text x="876" y="191" text-anchor="middle" class="cp">then remove</text><text x="876" y="209" text-anchor="middle" class="cp">instance count</text>
<path d="M636 222V266H385V291" class="line"/><rect x="283" y="297" width="205" height="83" rx="12" class="count"/><text x="385" y="326" text-anchor="middle" font-size="16" font-weight="750">Definition count</text><text x="385" y="349" text-anchor="middle" class="cp">increments when</text><text x="385" y="367" text-anchor="middle" class="sm">a failing instance is removed</text>
<path d="M488 338H528" class="line"/><rect x="534" y="297" width="205" height="83" rx="12" class="queue"/><text x="636" y="326" text-anchor="middle" font-size="16" font-weight="750">Definition limit?</text><text x="636" y="349" text-anchor="middle" class="cp">count ≥ definition limit</text><text x="636" y="367" text-anchor="middle" class="sm">enqueue full destruction</text>
<path d="M739 338H779" class="line"/><rect x="785" y="297" width="183" height="83" rx="12" class="action"/><text x="876" y="326" text-anchor="middle" font-size="16" font-weight="750">Destroy definition</text><text x="876" y="349" text-anchor="middle" class="cp">catch errors</text><text x="876" y="367" text-anchor="middle" class="cp">clear count in finally</text>
<rect x="32" y="420" width="936" height="148" rx="14" class="warn"/><text x="56" y="450" font-size="16" font-weight="750">Important cleanup boundary</text><text x="56" y="476" class="cp">The instance threshold callback calls reporting and definition-error logic before DestroyHandle().</text><text x="56" y="499" class="cp">That path has no encompassing try/finally; if an earlier callback throws, handle destruction or count removal may not run.</text><text x="56" y="526" class="cp">Definition destruction does use try/catch/finally for its destruction attempt and definition-count cleanup.</text><text x="56" y="549" class="sm">Read the source and error-handling guide for the precise guarantees; this diagram does not promise universal containment.</text></svg>