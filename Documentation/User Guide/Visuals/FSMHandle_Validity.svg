<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" role="img" aria-labelledby="title desc">
<title id="title">FSM_API: validity is suspension, destruction is removal</title>
<desc id="desc">An invalid context causes the scheduler to skip the registered handle while preserving its state and memory. Restoring validity resumes that same handle. Explicit DestroyInstance removes the handle from the registry, exits the current state, and invalidates the context. IsValid mirrors Context.IsValid and is not an independent flag.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#101b2d"/><stop offset="1" stop-color="#20334d"/></linearGradient>
  <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#b8cce4"/></marker>
  <style>
    text{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#f0f6ff}
    .subtitle{font-size:16px;fill:#bfd0e4}
    .heading{font-size:22px;font-weight:700}
    .body{font-size:17px}
    .small{font-size:14px;fill:#bfd0e4}
    .node{fill:#1b3048;stroke:#6f8ba9;stroke-width:1.6}
    .suspend{fill:#143d4b;stroke:#5ed5e7;stroke-width:2}
    .destroy{fill:#482d35;stroke:#ff9c91;stroke-width:2}
    .line{fill:none;stroke:#b8cce4;stroke-width:2.5;marker-end:url(#arrow)}
  </style>
</defs>
<rect width="1000" height="500" rx="24" fill="url(#bg)"/>
<text x="32" y="39" font-size="13" font-weight="700" letter-spacing="2.2" fill="#7ce1f5">FSM_API • LIFECYCLE SEMANTICS</text>
<text x="32" y="76" font-size="29" font-weight="750">Invalid is not destroyed</text>
<text class="subtitle" x="32" y="105">IsValid mirrors Context.IsValid · it is a processing gate, not a removal command</text>
<rect class="node" x="32" y="145" width="260" height="104" rx="14"/>
<text class="heading" x="52" y="177">Registered handle</text>
<text class="body" x="52" y="204">Current state + context</text>
<text class="small" x="52" y="228">Occupies its registry slot</text>
<path class="line" d="M292 197H354"/>
<rect class="suspend" x="362" y="145" width="282" height="104" rx="14"/>
<text class="heading" x="382" y="177">Suspend · IsValid = false</text>
<text class="body" x="382" y="204">Scheduler skips processing</text>
<text class="small" x="382" y="228">Same handle and state retained</text>
<path class="line" d="M503 249V280"/>
<rect class="suspend" x="362" y="288" width="282" height="92" rx="14"/>
<text class="heading" x="382" y="320">Resume · IsValid = true</text>
<text class="body" x="382" y="347">Same handle becomes eligible</text>
<path class="line" d="M362 334H325V197H292"/>
<text class="small" x="337" y="274" text-anchor="end">same instance</text>
<rect class="destroy" x="684" y="145" width="284" height="235" rx="14"/>
<text class="heading" x="704" y="177">DestroyInstance(handle)</text>
<text class="body" x="704" y="210">1. Remove from registry</text>
<text class="body" x="704" y="241">2. Exit current state</text>
<text class="body" x="704" y="272">3. Invalidate context</text>
<path d="M704 294H946" stroke="#c46d70" stroke-width="1.5"/>
<text class="small" x="704" y="320">Terminal teardown path</text>
<text class="small" x="704" y="343">Not a reusable pool entry</text>
<path class="line" d="M292 225H330V405H824V388"/>
<text class="small" x="500" y="399" text-anchor="middle">Explicit destruction is a separate operation</text>
<rect x="32" y="430" width="936" height="42" rx="10" fill="#0d1726" stroke="#435873"/>
<text class="small" x="50" y="456">Source-grounded conceptual diagram · standalone SVG authored for FSM_API · not live telemetry · not generated by GUI.SVG</text>
<circle r="5" fill="#ffffff" stroke="#5ed5e7" stroke-width="2">
  <animateMotion dur="5s" repeatCount="indefinite" path="M292 197H354 M503 249V280 M362 334H325V197H292"/>
</circle>
</svg>