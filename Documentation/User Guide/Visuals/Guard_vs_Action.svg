<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 510" role="img" aria-labelledby="title desc">
<title id="title">Keep transition guards separate from state actions</title><desc id="desc">A conceptual FSM_API flow. Application-owned context data is read by a transition condition, which returns true or false. If true, the transition is selected according to documented priority and the current state exits; the target state enters on the next tick. State actions perform effects. Conditions should be predicates, not places for side effects.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101827"/><stop offset="1" stop-color="#1b3040"/></linearGradient><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#9ab4c7"/></marker><style>text{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#edf5fb}.ey{font-size:12px;font-weight:800;letter-spacing:1.7px;fill:#9eb4c7}.hd{font-size:21px;font-weight:750}.cp{font-size:14px;fill:#c2d1dd}.small{font-size:12px;fill:#b5c6d3}.panel{fill:#172a3a;stroke:#3d586d;stroke-width:1.5}.data{fill:#183e4b;stroke:#69d6f2;stroke-width:1.5}.guard{fill:#352e1f;stroke:#f3c56e;stroke-width:1.5}.act{fill:#163d30;stroke:#6fdaa6;stroke-width:1.5}.line{fill:none;stroke:#9ab4c7;stroke-width:2.2;marker-end:url(#arrow)}</style></defs>
<rect width="1000" height="510" rx="20" fill="url(#bg)"/><text x="32" y="38" class="ey">A RULE IS NOT AN ACTION</text><text x="32" y="72" class="hd">Guard first. Effects in state actions.</text><text x="32" y="97" class="cp">A transition condition answers “may we move?” It should not perform the move itself.</text><path d="M32 115H968" stroke="#344d60"/>
<rect x="34" y="157" width="210" height="92" rx="13" class="data"/><text x="139" y="184" text-anchor="middle" font-size="16" font-weight="750">Context data</text><text x="139" y="207" text-anchor="middle" class="cp">HasInput = true</text><text x="139" y="229" text-anchor="middle" class="small">Application owns this data.</text>
<path d="M244 203H290" class="line"/><rect x="296" y="157" width="220" height="92" rx="13" class="guard"/><text x="406" y="184" text-anchor="middle" font-size="16" font-weight="750">Transition guard</text><text x="406" y="207" text-anchor="middle" class="cp">return ctx.HasInput</text><text x="406" y="229" text-anchor="middle" class="small">Read + return true/false.</text>
<path d="M516 203H561" class="line"/><path d="M620 154L678 203L620 252L562 203Z" fill="#273a4b" stroke="#9ab4c7" stroke-width="1.5"/><text x="620" y="208" text-anchor="middle" font-size="14" font-weight="750">True?</text>
<path d="M678 203H720" class="line"/><text x="697" y="190" class="small">Yes</text><rect x="726" y="157" width="236" height="92" rx="13" class="act"/><text x="844" y="184" text-anchor="middle" font-size="16" font-weight="750">Transition selected</text><text x="844" y="207" text-anchor="middle" class="cp">Exit current state</text><text x="844" y="229" text-anchor="middle" class="small">Target enters next tick.</text>
<path d="M620 252V298H406V254" class="line"/><text x="475" y="290" class="small">No: remain in current state</text>
<rect x="34" y="329" width="932" height="135" rx="14" class="panel"/><text x="56" y="360" class="ey">WHERE EFFECTS BELONG</text><rect x="56" y="379" width="265" height="60" rx="10" class="act"/><text x="188" y="404" text-anchor="middle" font-size="15" font-weight="750">onEnter / onUpdate / onExit</text><text x="188" y="425" text-anchor="middle" class="small">Perform state-specific work.</text><text x="349" y="396" class="cp">Avoid side effects in guards: conditions can be evaluated during transition selection.</text><text x="349" y="420" class="cp">If multiple guards match, definition order and any-state priority matter.</text><text x="349" y="444" class="cp">Model an event/output explicitly in context or state logic instead.</text></svg>