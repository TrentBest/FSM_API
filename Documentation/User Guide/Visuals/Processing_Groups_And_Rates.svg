<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" role="img" aria-labelledby="title desc">
<title id="title">Host-driven processing groups and per-definition process rates</title><desc id="desc">The host decides when to call Update with a named processing group. FSM_API selects definitions in that group and applies each definition's ProcessRate: one means each group tick, N greater than one means every Nth group tick, and zero is not processed by the group's automatic tick. Zero-rate behavior requires explicit stepping. The library does not create the host's update loop.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101827"/><stop offset="1" stop-color="#1b3040"/></linearGradient><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#9ab4c7"/></marker><style>text{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#edf5fb}.ey{font-size:12px;font-weight:800;letter-spacing:1.7px;fill:#9eb4c7}.hd{font-size:21px;font-weight:750}.cp{font-size:14px;fill:#c2d1dd}.sm{font-size:12px;fill:#b5c6d3}.panel{fill:#172a3a;stroke:#3d586d;stroke-width:1.5}.host{fill:#183e4b;stroke:#69d6f2;stroke-width:1.5}.group{fill:#302a43;stroke:#c5a6f5;stroke-width:1.5}.rate{fill:#352e1f;stroke:#f3c56e;stroke-width:1.5}.live{fill:#163d30;stroke:#6fdaa6;stroke-width:1.5}.line{fill:none;stroke:#9ab4c7;stroke-width:2.2;marker-end:url(#arrow)}</style></defs>
<rect width="1000" height="540" rx="20" fill="url(#bg)"/><text x="32" y="38" class="ey">SCHEDULING · WHO OWNS THE CLOCK?</text><text x="32" y="72" class="hd">The host owns ticks; FSM_API applies group and rate rules</text><text x="32" y="97" class="cp">A processing group is a named selection, not a built-in engine loop.</text><path d="M32 115H968" stroke="#344d60"/>
<rect x="34" y="145" width="235" height="105" rx="13" class="host"/><text x="151" y="174" text-anchor="middle" font-size="17" font-weight="750">Host application</text><text x="151" y="198" text-anchor="middle" class="cp">chooses when to tick</text><text x="151" y="222" text-anchor="middle" class="sm">Update("Gameplay")</text>
<path d="M269 197H315" class="line"/><rect x="321" y="145" width="210" height="105" rx="13" class="group"/><text x="426" y="174" text-anchor="middle" font-size="17" font-weight="750">Processing group</text><text x="426" y="198" text-anchor="middle" class="cp">selects registered</text><text x="426" y="222" text-anchor="middle" class="cp">definitions in that group</text>
<path d="M531 197H577" class="line"/><rect x="583" y="145" width="190" height="105" rx="13" class="rate"/><text x="678" y="174" text-anchor="middle" font-size="17" font-weight="750">ProcessRate</text><text x="678" y="198" text-anchor="middle" class="cp">checks cadence</text><text x="678" y="222" text-anchor="middle" class="sm">per definition</text>
<path d="M773 197H819" class="line"/><rect x="825" y="145" width="141" height="105" rx="13" class="live"/><text x="895" y="174" text-anchor="middle" font-size="16" font-weight="750">Due?</text><text x="895" y="198" text-anchor="middle" class="cp">update live</text><text x="895" y="219" text-anchor="middle" class="cp">instances</text>
<text x="34" y="291" class="ey">RATE MEANING</text>
<rect x="34" y="310" width="286" height="91" rx="12" class="panel"/><text x="54" y="339" font-size="17" font-weight="750">ProcessRate = 1</text><text x="54" y="364" class="cp">Every tick of its processing group.</text><text x="54" y="385" class="sm">Group cadence is host-controlled.</text>
<rect x="357" y="310" width="286" height="91" rx="12" class="panel"/><text x="377" y="339" font-size="17" font-weight="750">ProcessRate = N, N &gt; 1</text><text x="377" y="364" class="cp">Every Nth group tick.</text><text x="377" y="385" class="sm">A slower cadence, not a timer in seconds.</text>
<rect x="680" y="310" width="286" height="91" rx="12" class="panel"/><text x="700" y="339" font-size="17" font-weight="750">ProcessRate = 0</text><text x="700" y="364" class="cp">Skipped by automatic group ticks.</text><text x="700" y="385" class="sm">Use explicit stepping when needed.</text>
<rect x="34" y="425" width="932" height="75" rx="13" fill="#10251f" stroke="#39745d"/><text x="56" y="453" font-size="15" font-weight="750" fill="#8be4bc">Important boundary</text><text x="56" y="476" class="cp">A group named “FixedUpdate” has no special timing in core; only the host can give it that cadence.</text><text x="56" y="494" class="cp">Multiple groups are not automatically parallel threads. The host decides when and in what order to tick them.</text></svg>