<svg id="fsm-api-add-state" width="1280" height="720" viewBox="0 0 100 56.25" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Adding a state: preview becomes part of the definition" aria-labelledby="gui-svg-title gui-svg-description" xmlns="http://www.w3.org/2000/svg"><title id="gui-svg-title">Adding a state: preview becomes part of the definition</title><desc id="gui-svg-description">S0 is already defined. A proposed S1 appears as a dashed ghost, moves into its final position, resolves into a solid state, and gains a transition edge. The completed state is the static fallback.</desc><rect x="0" y="0" width="100" height="56.25" fill="#101d2b" id="background" /><text x="5" y="7" fill="#eef6ff" id="title" font-size="3.2" font-weight="700">Adding a state: preview becomes part of the definition</text><rect x="9" y="13" width="82" height="34" fill="#172b3c" rx="2" id="machine" stroke="#426478" stroke-width="0.45" /><circle cx="31" cy="29" r="7" fill="#174b49" id="s0" stroke="#7ee0bd" stroke-width="0.8" /><text x="28.5" y="30" fill="#ffffff" id="s0-label" font-size="3" font-weight="700">S0</text><line x1="38" y1="29" x2="62" y2="29" stroke="#ffcf86" stroke-width="0.7" id="new-edge" marker-end="url(#arrowhead)" /><defs id="definitions"><marker refX="5" refY="5" markerWidth="4" markerHeight="4" orient="auto" id="arrowhead"><polygon points="0,0 10,5 0,10" fill="#ffcf86" id="arrowhead-shape" /></marker></defs><circle cx="69" cy="29" r="7" fill="#25385a" id="s1" stroke="#a5a9f5" stroke-width="0.8" stroke-dasharray="0 0"><animate attributeName="stroke-dasharray" from="7 4" to="0 0" dur="1.2s" begin="0s" fill="freeze" id="resolve-outline" /><animate attributeName="opacity" from="0.35" to="1" dur="1.2s" begin="0s" fill="freeze" id="resolve-opacity" /><animateTransform attributeName="transform" type="translate" from="0 8" to="0 0" dur="1.2s" begin="0s" id="settle-position" fill="freeze" /></circle><text x="66.5" y="30" fill="#ffffff" id="s1-label" font-size="3" font-weight="700">S1</text><text x="12" y="42" fill="#d6e7f4" id="sequence-caption" font-size="2.25">Existing state retained  •  proposed state resolves  •  connection becomes part of the definition</text><text x="12" y="52" fill="#9fb5c7" id="fallback-note" font-size="2.0">Static fallback: both states and their completed relationship remain visible.</text></svg>