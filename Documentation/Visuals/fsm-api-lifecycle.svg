<svg id="fsm-api-lifecycle" width="1280" height="720" viewBox="0 0 100 56.25" preserveAspectRatio="xMidYMid meet" role="img" aria-label="FSM_API handle lifecycle" aria-labelledby="gui-svg-title gui-svg-description" xmlns="http://www.w3.org/2000/svg"><title id="gui-svg-title">FSM_API handle lifecycle</title><desc id="gui-svg-description">A valid handle enters on its first eligible update, updates, evaluates transitions, exits, and enters the destination on a later update. Invalid context suspends execution without destruction.</desc><rect x="5" y="12" width="16" height="10" fill="#25385a" rx="1" id="created" stroke="#a5a9f5" /><text x="8" y="18" fill="#ffffff" id="created-t" font-size="2.5">Created</text><rect x="29" y="12" width="18" height="10" fill="#174b49" rx="1" id="entered" stroke="#7ee0bd" /><text x="34" y="18" fill="#ffffff" id="entered-t" font-size="2.5">Enter</text><rect x="55" y="12" width="18" height="10" fill="#174b49" rx="1" id="update" stroke="#7ee0bd" /><text x="60" y="18" fill="#ffffff" id="update-t" font-size="2.5">Update</text><rect x="81" y="12" width="15" height="10" fill="#493b2d" rx="1" id="transition" stroke="#ffcf86" /><text x="84" y="18" fill="#ffffff" id="transition-t" font-size="2.5">Guard</text><line x1="21" y1="17" x2="29" y2="17" stroke="#d4e2ee" stroke-width="0.5" id="a" /><line x1="47" y1="17" x2="55" y2="17" stroke="#d4e2ee" stroke-width="0.5" id="b" /><line x1="73" y1="17" x2="81" y2="17" stroke="#d4e2ee" stroke-width="0.5" id="c" /><rect x="81" y="36" width="15" height="10" fill="#493b2d" rx="1" id="exit" stroke="#ffcf86" /><text x="85" y="42" fill="#ffffff" id="exit-t" font-size="2.5">Exit</text><rect x="55" y="36" width="18" height="10" fill="#174b49" rx="1" id="next-enter" stroke="#7ee0bd" /><text x="57" y="42" fill="#ffffff" id="next-enter-t" font-size="2.2">Next Enter</text><line x1="88" y1="22" x2="88" y2="36" stroke="#ffcf86" stroke-width="0.5" id="d" /><line x1="81" y1="41" x2="73" y2="41" stroke="#d4e2ee" stroke-width="0.5" id="e" /><text x="8" y="57" fill="#eef6ff" id="timing" font-size="2.7">The destination Enter runs on the next eligible update — not in the transition step.</text><rect x="8" y="68" width="36" height="10" fill="#493b2d" rx="1" id="suspend" stroke="#ffcf86" /><text x="11" y="74" fill="#ffffff" id="suspend-t" font-size="2.2">IsValid = false → suspended</text><rect x="56" y="68" width="36" height="10" fill="#4b2732" rx="1" id="destroy" stroke="#ff8f9b" /><text x="59" y="74" fill="#ffffff" id="destroy-t" font-size="2.2">Explicit destroy → removed</text></svg>