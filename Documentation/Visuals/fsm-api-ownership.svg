<svg id="fsm-api-ownership" width="1280" height="720" viewBox="0 0 100 56.25" preserveAspectRatio="xMidYMid meet" role="img" aria-label="FSM_API ownership boundaries" aria-labelledby="gui-svg-title gui-svg-description" xmlns="http://www.w3.org/2000/svg"><title id="gui-svg-title">FSM_API ownership boundaries</title><desc id="gui-svg-description">The host owns the clock and domain data. FSM_API owns definitions and handles. A handle retains the caller-owned context reference.</desc><rect x="4" y="5" width="92" height="12" fill="#19344a" rx="1" id="host" stroke="#69b9d0" /><text x="8" y="12" fill="#f4f8fc" id="host-label" font-size="2.5">APPLICATION / HOST — owns data, services, and update loop</text><rect x="8" y="25" width="36" height="19" fill="#25385a" rx="1" id="definition" stroke="#a5a9f5" /><text x="11" y="31" fill="#ffffff" id="definition-label" font-size="2.7" font-weight="700">FSM DEFINITION</text><text x="11" y="37" fill="#d8e4f2" id="definition-detail" font-size="2.1">States · guards · callbacks</text><rect x="56" y="25" width="36" height="19" fill="#174b49" rx="1" id="handle" stroke="#7ee0bd" /><text x="59" y="31" fill="#ffffff" id="handle-label" font-size="2.7" font-weight="700">LIVE FSM HANDLE</text><text x="59" y="37" fill="#d8f4eb" id="handle-detail" font-size="2.1">State · lifecycle · identity</text><line x1="44" y1="34" x2="56" y2="34" stroke="#d4e2ee" stroke-width="0.45" id="definition-handle" /><rect x="56" y="54" width="36" height="15" fill="#493b2d" rx="1" id="context" stroke="#ffcf86" /><text x="59" y="60" fill="#ffffff" id="context-label" font-size="2.35" font-weight="700">CALLER-OWNED CONTEXT</text><text x="59" y="65" fill="#f8e7c8" id="context-detail" font-size="2.1">Same object reference</text><line x1="74" y1="44" x2="74" y2="54" stroke="#ffcf86" stroke-width="0.5" id="handle-context" /><text x="8" y="57" fill="#d8e4f2" id="host-note" font-size="2.5">Host calls Update when ready</text><text x="8" y="77" fill="#eef6ff" id="boundary-note" font-size="2.5">FSM_API does not own the application's clock or copy its domain object.</text></svg>