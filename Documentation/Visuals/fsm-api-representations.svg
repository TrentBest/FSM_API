<svg id="fsm-api-representations" width="1280" height="1024" viewBox="0 0 100 80" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Two representations, one behavioral contract" aria-labelledby="gui-svg-title gui-svg-description" xmlns="http://www.w3.org/2000/svg"><title id="gui-svg-title">Two representations, one behavioral contract</title><desc id="gui-svg-description">String-backed and integer-backed runtimes have independent registries and identity spaces. Explicit Transfer converts definitions between them.</desc><rect x="5" y="12" width="34" height="30" fill="#25385a" rx="1" id="string" stroke="#a5a9f5" /><text x="9" y="20" fill="#ffffff" id="string-title" font-size="3" font-weight="700">STRING-BACKED</text><text x="9" y="28" fill="#d8e4f2" id="string-id" font-size="2.4">Names · named groups</text><text x="9" y="36" fill="#d8e4f2" id="string-handle" font-size="2.4">FSMHandle</text><rect x="61" y="12" width="34" height="30" fill="#174b49" rx="1" id="integer" stroke="#7ee0bd" /><text x="65" y="20" fill="#ffffff" id="integer-title" font-size="3" font-weight="700">INTEGER-BACKED</text><text x="65" y="28" fill="#d8f4eb" id="integer-id" font-size="2.4">IDs · integer groups</text><text x="65" y="36" fill="#d8f4eb" id="integer-handle" font-size="2.4">FSMHandleInt</text><rect x="43" y="52" width="14" height="10" fill="#493b2d" rx="1" id="transfer" stroke="#ffcf86" /><text x="45" y="58" fill="#ffffff" id="transfer-t" font-size="2.2">Transfer</text><line x1="22" y1="42" x2="48" y2="52" stroke="#ffcf86" stroke-width="0.5" id="left" /><line x1="78" y1="42" x2="52" y2="52" stroke="#ffcf86" stroke-width="0.5" id="right" /><text x="8" y="77" fill="#eef6ff" id="shared" font-size="2.4">Same observable contract: lifecycle · transitions · scheduling · errors</text></svg>