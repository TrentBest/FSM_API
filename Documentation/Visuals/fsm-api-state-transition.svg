<svg id="fsm-api-state-transition" width="1280" height="720" viewBox="0 0 100 56.25" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Executing a transition: lifecycle order matters" aria-labelledby="gui-svg-title gui-svg-description" xmlns="http://www.w3.org/2000/svg"><title id="gui-svg-title">Executing a transition: lifecycle order matters</title><desc id="gui-svg-description">The active marker highlights S0, follows the accepted transition edge, and arrives at S1. Exit belongs to the state being left; destination Enter is shown as the next eligible update.</desc><rect x="0" y="0" width="100" height="56.25" fill="#101d2b" id="background" /><text x="5" y="7" fill="#eef6ff" id="title" font-size="3.2" font-weight="700">Executing a transition: lifecycle order matters</text><circle cx="27" cy="28" r="8" fill="#174b49" id="s0" stroke="#7ee0bd" stroke-width="0.8" /><text x="24.5" y="29" fill="#ffffff" id="s0-label" font-size="3" font-weight="700">S0</text><circle cx="73" cy="28" r="8" fill="#25385a" id="s1" stroke="#a5a9f5" stroke-width="0.8" /><text x="70.5" y="29" fill="#ffffff" id="s1-label" font-size="3" font-weight="700">S1</text><line x1="35" y1="28" x2="65" y2="28" stroke="#ffcf86" stroke-width="0.8" id="transition-edge" /><circle cx="27" cy="28" r="2" fill="#ffcf86" id="active-marker" stroke="#fff1ce" stroke-width="0.35"><animate attributeName="cx" dur="3s" values="27;73" keyTimes="0;1" begin="0s" fill="freeze" id="traverse-edge" /></circle><text x="15" y="43" fill="#ffcf86" id="exit-step" font-size="2.5" font-weight="700">1  EXIT S0</text><text x="39" y="43" fill="#d6e7f4" id="identity-step" font-size="2.25">2  Current-state identity changes</text><text x="15" y="50" fill="#7ee0bd" id="enter-step" font-size="2.5" font-weight="700">3  ENTER S1 on the next eligible update</text></svg>