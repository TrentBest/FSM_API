<svg id="fsm-api-tick-atomic-mutation" width="1280" height="720" viewBox="0 0 100 56.25" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Definition replacement waits for the tick boundary" aria-labelledby="gui-svg-title gui-svg-description" xmlns="http://www.w3.org/2000/svg"><title id="gui-svg-title">Definition replacement waits for the tick boundary</title><desc id="gui-svg-description">A callback requests a replacement while the tick is executing. The request is queued; all selected handles finish against the stable definition view; the replacement commits during finalization.</desc><rect x="0" y="0" width="100" height="56.25" fill="#101d2b" id="background" /><text x="5" y="7" fill="#eef6ff" id="title" font-size="3.2" font-weight="700">Definition replacement waits for the tick boundary</text><rect x="7" y="20" width="17" height="15" fill="#25385a" rx="1" id="step-7" stroke="#a5a9f5" stroke-width="0.6" /><text x="8.2" y="26" fill="#ffffff" id="step-title-7" font-size="2.1" font-weight="700">1  SNAPSHOT</text><text x="8.2" y="31" fill="#d6e7f4" id="step-detail-7" font-size="1.75">Eligible handles</text><rect x="30" y="20" width="17" height="15" fill="#174b49" rx="1" id="step-30" stroke="#7ee0bd" stroke-width="0.6" /><text x="31.2" y="26" fill="#ffffff" id="step-title-30" font-size="2.1" font-weight="700">2  EXECUTE</text><text x="31.2" y="31" fill="#d6e7f4" id="step-detail-30" font-size="1.75">Stable definition</text><rect x="53" y="20" width="17" height="15" fill="#493b2d" rx="1" id="step-53" stroke="#ffcf86" stroke-width="0.6" /><text x="54.2" y="26" fill="#ffffff" id="step-title-53" font-size="2.1" font-weight="700">3  QUEUE</text><text x="54.2" y="31" fill="#d6e7f4" id="step-detail-53" font-size="1.75">Replacement requested</text><rect x="76" y="20" width="17" height="15" fill="#25385a" rx="1" id="step-76" stroke="#a5a9f5" stroke-width="0.6" /><text x="77.2" y="26" fill="#ffffff" id="step-title-76" font-size="2.1" font-weight="700">4  COMMIT</text><text x="77.2" y="31" fill="#d6e7f4" id="step-detail-76" font-size="1.75">Tick boundary</text><line x1="24" y1="27.5" x2="76" y2="27.5" stroke="#d4e2ee" stroke-width="0.45" id="progress-line" /><circle cx="15.5" cy="17" r="1.8" fill="#ffcf86" id="progress-marker"><animate attributeName="cx" dur="4s" values="15.5;38.5;61.5;84.5" keyTimes="0;0.33;0.66;1" begin="0s" fill="freeze" id="advance" /></circle><text x="9" y="46" fill="#eef6ff" id="invariant" font-size="2.5" font-weight="700">Invariant: no sibling handle observes a half-applied replacement.</text><text x="9" y="52" fill="#9fb5c7" id="finalization" font-size="2.0">Finalization processes pending lifecycle work before queued registrations.</text></svg>