<svg id="fsm-api-tick-boundary" width="1280" height="1024" viewBox="0 0 100 80" preserveAspectRatio="xMidYMid meet" role="img" aria-label="A tick is a consistency boundary" aria-labelledby="gui-svg-title gui-svg-description" xmlns="http://www.w3.org/2000/svg"><title id="gui-svg-title">A tick is a consistency boundary</title><desc id="gui-svg-description">The runtime snapshots eligible work, defers callback-originated definition replacement, processes lifecycle changes, then commits the last queued replacement at the end of the tick.</desc><rect x="5" y="12" width="19" height="16" fill="#25385a" rx="1" id="snapshot" stroke="#a5a9f5" /><text x="8" y="19" fill="#ffffff" id="snapshot-t" font-size="2.4" font-weight="700">1. SNAPSHOT</text><text x="8" y="24" fill="#d8e4f2" id="snapshot-d" font-size="2.1">Eligible handles</text><rect x="29" y="12" width="19" height="16" fill="#174b49" rx="1" id="execute" stroke="#7ee0bd" /><text x="32" y="19" fill="#ffffff" id="execute-t" font-size="2.4" font-weight="700">2. EXECUTE</text><text x="32" y="24" fill="#d8f4eb" id="execute-d" font-size="2.1">Stable definition</text><rect x="53" y="12" width="19" height="16" fill="#493b2d" rx="1" id="queue" stroke="#ffcf86" /><text x="56" y="19" fill="#ffffff" id="queue-t" font-size="2.4" font-weight="700">3. QUEUE</text><text x="56" y="24" fill="#f8e7c8" id="queue-d" font-size="2.1">Last replace wins</text><rect x="77" y="12" width="18" height="16" fill="#25385a" rx="1" id="commit" stroke="#a5a9f5" /><text x="80" y="19" fill="#ffffff" id="commit-t" font-size="2.4" font-weight="700">4. COMMIT</text><text x="80" y="24" fill="#d8e4f2" id="commit-d" font-size="2.1">At tick end</text><line x1="24" y1="20" x2="29" y2="20" stroke="#d4e2ee" stroke-width="0.5" id="ab" /><line x1="48" y1="20" x2="53" y2="20" stroke="#d4e2ee" stroke-width="0.5" id="bc" /><line x1="72" y1="20" x2="77" y2="20" stroke="#d4e2ee" stroke-width="0.5" id="cd" /><text x="8" y="48" fill="#eef6ff" id="note" font-size="2.8">Callbacks may request replacement, but no sibling handle sees it mid-tick.</text><text x="8" y="58" fill="#d8e4f2" id="finalize" font-size="2.5">Finalization order: pending lifecycle work → queued registrations.</text><text x="8" y="68" fill="#ffcf86" id="reentry" font-size="2.5">Nested Update / UpdateAll / handle updates are rejected.</text></svg>